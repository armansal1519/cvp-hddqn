[project]
name = "kx-cvp-baselines"
version = "0.1.0"
description = "Contamination-aware baseline suite for the frozen CVP-HDDQN experiment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "kx-cvp-ablations",
  "kx-simple-hmadrl",
  "numpy>=2,<3",
  "pyarrow>=17,<24",
]

[tool.uv.sources]
kx-cvp-ablations = { workspace = true }
kx-simple-hmadrl = { workspace = true }

[project.optional-dependencies]
fqi = ["lightgbm>=4.5,<5"]
neural = ["torch>=2.5,<3"]
report = ["matplotlib>=3.10,<4", "pypdf>=5,<6"]
test = [
  "lightgbm>=4.5,<5",
  "matplotlib>=3.10,<4",
  "pypdf>=5,<6",
  "pytest>=8,<10",
  "torch>=2.5,<3",
]

[project.scripts]
kx-cvp-baselines = "kx_cvp_baselines.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx_cvp_baselines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
