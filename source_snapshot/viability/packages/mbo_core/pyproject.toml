[project]
name = "kx-mbo-core"
version = "0.1.0"
description = "Causal GC MBO replay and viability utilities"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "polars>=1.20,<2",
  "pyarrow>=18,<24",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.scripts]
kx-mbo-core = "kx_mbo_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx_mbo_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

