[project]
name = "kx-base-gc"
version = "0.1.0"
description = "Registered causal structural reconstruction of the H1/M15/M5 base-paper hierarchy"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "kx-mbo-core",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pyyaml>=6,<7",
]

[tool.uv.sources]
kx-mbo-core = { workspace = true }

[project.optional-dependencies]
train = ["torch>=2.5,<3"]

[project.scripts]
kx-base-gc-train-seed = "kx_base_gc.cli:main"
kx-base-gc-prepare-empirical = "kx_base_gc.empirical_cli:main"
kx-base-gc-scan-support = "kx_base_gc.support_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx_base_gc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
