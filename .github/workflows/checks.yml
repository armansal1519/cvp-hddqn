name: Source-only checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install core and synthetic-check dependencies
        run: python -m pip install -e '.[check]'
      - name: Verify source inventory
        run: python scripts/verify_manifest.py
      - name: Check synthetic model and ledger invariants
        run: python scripts/check_core.py
      - name: Inspect untrained synthetic forward pass
        run: python examples/inspect_model.py
